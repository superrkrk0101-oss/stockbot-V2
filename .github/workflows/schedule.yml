name: Wall Street Morning Report

on:
  schedule:
    - cron: '0 23 * * *' # [매일 아침 8시 자동 실행] (기존 V5 장점)
  workflow_dispatch:     # [깃허브 수동 실행 버튼]
  repository_dispatch:   # [디스코드/Zapier 원격 호출] (새로운 장점)
    types: [run-stock-bot]

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 1. 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 🐍 2. 파이썬 환경 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # 경고 해결을 위한 버전업

    - name: 📦 3. 필수 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install yfinance google-generativeai groq requests pandas

    - name: 🚀 4. 주식 분석 스크립트 실행
      env: # 보안을 위해 스크립트 실행 시에만 API 키 주입
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: python main.py
