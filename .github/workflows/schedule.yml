name: Morning Stock Bot

on:
  schedule:
    # 한국 시간 매일 아침 8시 실행 (UTC 기준 23시)
    - cron: '0 23 * * *'
  workflow_dispatch: # 수동 테스트 버튼 활성화

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v3

      - name: 파이썬 설치하기
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필요한 도구 설치하기
        run: pip install -r requirements.txt

      - name: 주식 브리핑 실행하기
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
